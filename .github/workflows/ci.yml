name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      # The production Archive signs private derivative URLs with Supabase.
      # CI deliberately uses the existing non-secret fixture so the build proves
      # prerendering without requiring service-role credentials in GitHub Actions.
      - run: npm run build
        env:
          PLAYWRIGHT_ARCHIVE_FIXTURE: "1"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
